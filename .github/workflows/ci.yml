name: CI — Build & Test

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
      - 'pr/**'
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Game Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile and verify all game bundles & entrypoints
        run: node build.js --verify

  test:
    name: Gauntlet Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Daily Gauntlet unit & E2E test suite
        run: node gauntlet/run-tests.js
